
name: CI Workflow - Docker

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Build Docker Image
        run: docker build -t task-manager:latest .

      - name: Run Docker Container
        run: |
          docker run --rm \
            -e GITHUB_USER="${{ github.actor }}" \
            -v "${{ github.workspace }}:/output" \
            task-manager:latest

      - name: Commit and Push Updated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update index.html with task and test results"
            git push
          fi
